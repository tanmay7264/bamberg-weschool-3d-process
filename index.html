<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bamberg × WeSchool 2026–27 — The Process in 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --purple:#5C4178; --deep:#34254A; --green:#509844; --mint:#B9E3AE; --amber:#D9952B; --lav:#E4DCEF; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#140e1e; font-family: Inter, system-ui, sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #c:active { cursor:grabbing; }
  .brand { position:fixed; top:16px; left:16px; display:flex; align-items:center; gap:14px; pointer-events:none; }
  .brand .logo { background:#fff; border-radius:10px; padding:6px 10px; display:flex; }
  .brand .logo img { height:30px; display:block; }
  .brand h1 { margin:0; font-size:16px; font-weight:800; letter-spacing:.2px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .brand p { margin:2px 0 0; font-size:12px; color:var(--mint); font-weight:600; letter-spacing:1.5px; text-transform:uppercase; }
  #panel { position:fixed; right:16px; top:16px; width:min(380px, calc(100vw - 32px)); max-height:calc(100vh - 120px); overflow:auto;
    background:rgba(28,19,42,.86); backdrop-filter: blur(10px); border:1px solid rgba(228,220,239,.16); border-radius:16px; padding:20px 22px;
    box-shadow:0 12px 40px rgba(0,0,0,.45); transition: opacity .35s, transform .35s; }
  #panel.fade { opacity:0; transform: translateY(8px); }
  #panel .step { font-size:12px; font-weight:800; letter-spacing:2px; color:var(--mint); text-transform:uppercase; }
  #panel h2 { margin:6px 0 10px; font-size:24px; line-height:1.2; }
  #panel .lead { font-size:15px; color:#E9E3F2; line-height:1.5; margin:0 0 12px; }
  #panel ul { margin:0; padding-left:18px; }
  #panel li { font-size:14px; line-height:1.5; color:#D6CCE5; margin-bottom:6px; }
  #panel li b { color:#fff; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; margin:2px 4px 2px 0; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #nav { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:10px;
    background:rgba(28,19,42,.86); backdrop-filter: blur(10px); border:1px solid rgba(228,220,239,.16); border-radius:40px; padding:8px 10px; }
  #nav button { border:0; background:var(--purple); color:#fff; font:600 14px Inter, sans-serif; padding:9px 16px; border-radius:30px; cursor:pointer; }
  #nav button:hover { background:#6e5190; }
  #nav button.ghost { background:transparent; border:1px solid rgba(255,255,255,.25); }
  #nav button.on { background:var(--green); }
  #dots { display:flex; gap:6px; padding:0 4px; }
  #dots span { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; transition: all .25s; }
  #dots span.active { background:var(--mint); width:26px; border-radius:6px; }
  #hint { position:fixed; left:16px; bottom:22px; font-size:12px; color:rgba(255,255,255,.55); }
  body.light { background:#F4F0F9; color:#1F1A2B; }
  body.light .brand h1 { color:#34254A; text-shadow:none; }
  body.light .brand p { color:#509844; }
  body.light #panel, body.light #nav { background:rgba(255,255,255,.9); border-color:rgba(92,65,120,.18); box-shadow:0 12px 40px rgba(52,37,74,.15); }
  body.light #panel .step { color:#509844; }
  body.light #panel h2 { color:#34254A; }
  body.light #panel .lead { color:#2E2640; }
  body.light #panel li { color:#4A4258; }
  body.light #panel li b { color:#1F1A2B; }
  body.light .chip { background:#F2EEF7; border-color:#E4DCEF; color:#34254A; }
  body.light #nav button.ghost { border-color:rgba(52,37,74,.25); color:#34254A; }
  body.light #dots span { background:rgba(52,37,74,.2); }
  body.light #dots span.active { background:#509844; }
  body.light #hint { color:rgba(31,26,43,.55); }
  .brand .logo { box-shadow:0 2px 10px rgba(0,0,0,.12); }
  @media (max-width: 720px) {
    #panel { top:auto; bottom:84px; max-height:42vh; }
    .brand h1 { font-size:13px; } #hint { display:none; }
    #nav button { padding:8px 12px; font-size:13px; }
  }
</style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const C = { purple:0x5C4178, deep:0x34254A, green:0x509844, mint:0xB9E3AE, amber:0xD9952B, lav:0xE4DCEF, floor:0x221833 };
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x140e1e);
scene.fog = new THREE.Fog(0x140e1e, 90, 220);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 80, 95);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 8; controls.maxDistance = 170;
controls.target.set(0, 0, 6);

// lights
const hemi = new THREE.HemisphereLight(0xcfc3e0, 0x1a1226, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(40, 70, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-80, right:80, top:80, bottom:-80, near:1, far:200 });
scene.add(sun);

// ground + stars
const ground = new THREE.Mesh(new THREE.CircleGeometry(95, 96), new THREE.MeshStandardMaterial({ color:C.floor, roughness:0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
let grid = new THREE.GridHelper(190, 76, 0x3a2b52, 0x2a1f3c); grid.position.y = 0.02; scene.add(grid);
{
  const g = new THREE.BufferGeometry(), n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const r = 160 + Math.random() * 120, t = Math.random() * Math.PI * 2, f = Math.random() * Math.PI * 0.45;
    p[i*3] = r * Math.cos(t) * Math.cos(f); p[i*3+1] = 10 + r * Math.sin(f); p[i*3+2] = r * Math.sin(t) * Math.cos(f); }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ color:0xE4DCEF, size:0.9, fog:false, transparent:true, opacity:0.8 })); scene.add(stars);
}

// helpers
const updaters = [], baseMats = [], cohortUpdaters = [];
const std = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:0.45, metalness:0.1 }, extra));
const glow = (color, i = 0.9) => new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:i, roughness:0.3 });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function label(text, sub, { color = "#ffffff", bg = "rgba(52,37,74,0.92)", scale = 1 } = {}) {
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), pad = 28;
  ctx.font = "800 46px Inter, Arial"; const w1 = ctx.measureText(text).width;
  ctx.font = "600 30px Inter, Arial"; const w2 = sub ? ctx.measureText(sub).width : 0;
  cv.width = Math.ceil(Math.max(w1, w2) + pad * 2); cv.height = sub ? 128 : 84;
  ctx.fillStyle = bg; const r = 26;
  ctx.beginPath(); ctx.roundRect(0, 0, cv.width, cv.height, r); ctx.fill();
  ctx.fillStyle = color; ctx.font = "800 46px Inter, Arial"; ctx.textBaseline = "middle";
  ctx.fillText(text, pad, sub ? 42 : cv.height / 2);
  if (sub) { ctx.fillStyle = "#B9E3AE"; ctx.font = "600 30px Inter, Arial"; ctx.fillText(sub, pad, 94); }
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  const k = 0.012 * scale; s.scale.set(cv.width * k, cv.height * k, 1); s.renderOrder = 10; return s;
}
function platform(pos, title, sub) {
  const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
  const base = mesh(new THREE.CylinderGeometry(10, 10.6, 0.8, 64), std(0x2e2244, { roughness:0.8 }), 0, 0.4, 0, g);
  baseMats.push(base.material);
  base.userData.station = true;
  const ring = mesh(new THREE.TorusGeometry(10.3, 0.12, 8, 96), glow(C.green, 1.2), 0, 0.85, 0, g);
  ring.rotation.x = Math.PI / 2; ring.castShadow = false;
  const l = label(title, sub, { scale:1.15 }); l.position.set(0, 0, 0); g.add(l);
  g.userData.label = l; g.userData.base = base;
  return g;
}

// stations
const P = [
  new THREE.Vector3(-40, 0, 16), new THREE.Vector3(-30, 0, -18), new THREE.Vector3(-4, 0, -32), new THREE.Vector3(22, 0, -22),
  new THREE.Vector3(40, 0, 4), new THREE.Vector3(30, 0, 33), new THREE.Vector3(3, 0, 44), new THREE.Vector3(-24, 0, 42),
];
const stations = [];

// 1 Kick-off: Bamberg + WeSchool towers with exchange arcs
{
  const g = platform(P[0], "01 · Kick-off", "Partnership launch"); stations.push(g);
  g.userData.label.position.set(0, 13, 0);
  const tower = (x, z, h, color, name) => {
    mesh(new THREE.BoxGeometry(3, h, 3), std(color), x, 0.8 + h / 2, z, g);
    for (let i = 0; i < Math.floor(h / 1.4); i++) for (let s = -1; s <= 1; s += 2)
      mesh(new THREE.BoxGeometry(0.5, 0.6, 0.05), glow(0xF6E7A8, 0.6), x + s * 0.7, 1.6 + i * 1.4, z + 1.53, g).castShadow = false;
    const roof = mesh(new THREE.ConeGeometry(2.4, 2, 4), std(C.deep), x, 0.8 + h + 1, z, g); roof.rotation.y = Math.PI / 4;
    const l = label(name, null, { scale:0.75 }); l.position.set(x, 0.8 + h + 3.2, z); g.add(l);
    return new THREE.Vector3(x, 0.8 + h + 1.8, z);
  };
  const a = tower(-5, 0, 8, C.purple, "Uni Bamberg"), b = tower(4, -3.5, 6.5, C.green, "WeSchool Mumbai"), c = tower(5, 4, 5.5, C.amber, "WeSchool Bengaluru");
  [[a, b, C.green], [a, c, C.amber]].forEach(([p, q, col]) => {
    const mid = p.clone().add(q).multiplyScalar(0.5); mid.y += 5;
    const curve = new THREE.QuadraticBezierCurve3(p, mid, q);
    mesh(new THREE.TubeGeometry(curve, 40, 0.08, 6), glow(col, 1.4), 0, 0, 0, g).castShadow = false;
    for (let k = 0; k < 3; k++) {
      const orb = mesh(new THREE.SphereGeometry(0.28, 16, 16), glow(0xffffff, 1.5), 0, 0, 0, g); orb.castShadow = false;
      updaters.push((t) => { const u = ((t * 0.25 + k / 3) % 1); orb.position.copy(curve.getPoint(k % 2 ? 1 - u : u)); });
    }
  });
}

// 2 Industry challenges: 8 project pillars
{
  const g = platform(P[1], "02 · Industry challenges", "8 projects · 7 partners"); stations.push(g);
  g.userData.label.position.set(0, 13, 0);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, x = Math.cos(a) * 6, z = Math.sin(a) * 6, h = 2.5 + (i % 4) * 1.2;
    const col = i % 2 ? C.green : C.purple;
    mesh(new THREE.CylinderGeometry(1.1, 1.1, h, 6), std(col), x, 0.8 + h / 2, z, g);

    <li><b>WeSchool Mumbai</b> and <b>WeSchool Bengaluru</b> bring PGDM students in E-Business, RBA, BD&amp;I and Core.</li>
    <li>The arcs show the exchange running both ways for the whole programme.</li></ul>` },
  { title:"Industry challenges", s:1,
    html:`<p class="lead">Seven partner organisations contribute eight real problem statements.</p>
    <ul><li><b>P1 Siemens Healthineers:</b> Agentic AI for sustainability reporting</li>
    <li><b>P2 Toyo Engineering:</b> IT-driven workforce planning in EPC projects</li>
    <li><b>P3 Nayara Energy:</b> AI energy-loss detection in refineries</li>
    <li><b>P4 Green Computing Foundation:</b> carbon intelligence and green AI</li>
    <li><b>P5 Good Earth Eco:</b> sustainable waste management models</li>
    <li><b>P6 Good Earth Eco:</b> reverse vending machines for plastic</li>
    <li><b>P7 GroundReality (GridMats®):</b> scaling a circular product to Europe</li>
    <li><b>P8 Synthesis Winding:</b> vendor collaboration platform</li></ul>` },
  { title:"The cohort", s:2,
    html:`<p class="lead">32 students from three campuses, chosen for complementary strengths.</p>
    <ul><li><b>Bamberg (14):</b> information systems, strategy, sustainability, project and process management</li>
    <li><b>Mumbai (9):</b> engineering graduates with data, cloud, SAP and AI/ML skills</li>
    <li><b>Bengaluru (9):</b> commerce and BBA backgrounds: finance, BI and business research</li></ul>` },
  { title:"Cross-campus teams", s:3,
    html:`<p class="lead">Each team mixes all three campuses and works on one industry project.</p>
    <ul><li>Bamberg students team up with WeSchool students from Mumbai and Bengaluru.</li>
    <li>Business, technology and finance perspectives sit in every team.</li>
    <li>Teams work virtually across time zones, coordinated by SPOCs from both institutes.</li></ul>` },
  { title:"Mentoring triad", s:4,
    html:`<p class="lead">Every team is guided by three mentors.</p>
    <ul><li><b>Bamberg mentor:</b> research method, IS and business-model rigour</li>
    <li><b>WeSchool mentor:</b> scope, deliverables and quality of output</li>
    <li><b>Industry mentor:</b> problem owner who checks relevance, gives data access and validates the solution</li></ul>` },
  { title:"11-week roadmap", s:5,
    html:`<p class="lead">From discovery to a tested prototype, November 2026 to January 2027.</p>
    <ul><li><b>W1–2 Discover:</b> partner meetings, research, user personas</li>
    <li><b>W2–3 Define & ideate:</b> scope, deliverables, ideas</li>
    <li><b>W4–5 Business design:</b> storyboards, business model</li>
    <li><b>W6–8 Plan & architect:</b> tasks, high-level design, technology, wireframes</li>
    <li><b>W9–10 Build & test:</b> prototyping and testing</li>
    <li><b>W11 Present:</b> final presentation</li></ul>` },
  { title:"Weekly monitoring", s:6,
    html:`<p class="lead">Progress stays visible every week.</p>
    <ul><li><b>Weekly sync:</b> virtual stand-up across campuses</li>
    <li><b>Activity tracker:</b> SPOCs log start and end dates and status for each of the 13 activities</li>
    <li><b>Mentor checkpoints</b> (gold diamonds): scope sign-off W3, design W8, prototype W10, final W11</li></ul>` },
  { title:"Final presentation", s:7,
    html:`<p class="lead">In Week 11 each team presents its prototype and business case to partners and faculty.</p>
    <ul><li>Deliverables: a working prototype, a business model and recommendations.</li>
    <li>Outcome: real industry impact, cross-cultural teamwork and a network spanning Germany and India.</li></ul>` },
];

// camera for stations: outward offset
steps.forEach((st) => {
  if (st.hub) { st.tgt = [5, 1, 9]; st.cam = [-10, 19, 30]; return; }
  if (st.s === undefined) return;
  const c = P[st.s], dir = new THREE.Vector3(c.x, 0, c.z - 6).normalize();
  st.tgt = [c.x, 4, c.z];
  st.cam = [c.x + dir.x * 22, 15, c.z + dir.z * 22];
});

// UI
const panel = document.getElementById("panel"), dots = document.getElementById("dots");
steps.forEach((_, i) => { const d = document.createElement("span"); d.title = steps[i].title; d.onclick = () => go(i); dots.appendChild(d); });
let cur = 0, tween = null;
function go(i) {
  cur = (i + steps.length) % steps.length; const st = steps[cur];
  panel.classList.add("fade");
  setTimeout(() => {
    panel.innerHTML = `<div class="step">${cur === 0 ? "Overview" : st.hub ? "Centre plaza" : "Station " + (st.s + 1) + " of 8"}</div><h2>${st.title}</h2>${st.html}`;
    panel.classList.remove("fade");
  }, 250);
  [...dots.children].forEach((d, k) => d.classList.toggle("active", k === cur));
  tween = { t0: performance.now(), dur: 2200, fromP: camera.position.clone(), fromT: controls.target.clone(),
    toP: new THREE.Vector3(...st.cam), toT: new THREE.Vector3(...st.tgt) };
  stations.forEach((g, k) => { g.userData.active = k === st.s; });
}
document.getElementById("next").onclick = () => { stopAuto(); go(cur + 1); };
document.getElementById("prev").onclick = () => { stopAuto(); go(cur - 1); };
let autoTimer = null; const autoBtn = document.getElementById("auto");
function stopAuto() { clearInterval(autoTimer); autoTimer = null; autoBtn.classList.remove("on"); autoBtn.textContent = "▶ Auto tour"; }
autoBtn.onclick = () => { if (autoTimer) return stopAuto(); autoBtn.classList.add("on"); autoBtn.textContent = "❚❚ Pause"; go(cur + 1); autoTimer = setInterval(() => go(cur + 1), 7000); };
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { stopAuto(); go(cur + 1); } if (e.key === "ArrowLeft") { stopAuto(); go(cur - 1); } });

// click a station
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects([...stations, hubGroup], true);
  if (hits.length) { let o = hits[0].object; while (o && !stations.includes(o) && o !== hubGroup) o = o.parent; if (o === hubGroup) { stopAuto(); go(1); } else { const k = stations.indexOf(o); if (k >= 0) { stopAuto(); go(k + 2); } } }
});
controls.addEventListener("start", () => { tween = null; });

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function loop() {
  const t = clock.getElapsedTime();
  updaters.forEach((f) => f(t));
  stations.forEach((g) => { const s = g.userData.active ? 1 + Math.sin(t * 3) * 0.04 : 1;
    g.children[1].material.emissiveIntensity = g.userData.active ? 2 + Math.sin(t * 4) : 1.2; g.children[1].scale.set(s, s, s); });
  if (tween) { const k = Math.min(1, (performance.now() - tween.t0) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.fromP, tween.toP, e); controls.target.lerpVectors(tween.fromT, tween.toT, e);
    if (k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
const themeBtn = document.getElementById("theme");
function setTheme(light) {
  document.body.classList.toggle("light", light);
  const bg = light ? 0xF4F0F9 : 0x140e1e;
  scene.background.setHex(bg); scene.fog.color.setHex(bg);
  ground.material.color.setHex(light ? 0xEAE3F3 : C.floor);
  baseMats.forEach((m) => m.color.setHex(light ? 0xFFFFFF : 0x2e2244));
  hemi.color.setHex(light ? 0xffffff : 0xcfc3e0); hemi.groundColor.setHex(light ? 0xd8cfe6 : 0x1a1226); hemi.intensity = light ? 1.4 : 0.9;
  renderer.toneMappingExposure = light ? 1.05 : 1;
  stars.visible = !light;
  scene.remove(grid); grid.geometry.dispose();
  grid = light ? new THREE.GridHelper(190, 76, 0xcfc3e0, 0xddd4ea) : new THREE.GridHelper(190, 76, 0x3a2b52, 0x2a1f3c);
  grid.position.y = 0.02; scene.add(grid);
  themeBtn.textContent = light ? "☾ Dark" : "☀ Light";
  try { localStorage.setItem("bw3d-theme", light ? "light" : "dark"); } catch (e) {}
}
themeBtn.onclick = () => setTheme(!document.body.classList.contains("light"));
let saved = null; try { saved = localStorage.getItem("bw3d-theme"); } catch (e) {}
setTheme(saved === "light");
go(0); loop();
</script>
